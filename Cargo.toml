[workspace]
resolver = "3"
members = [
    "crates/kufeditor",
    "crates/kufeditor-formats",
    "crates/kufeditor-game",
    "crates/kufeditor-mods",
    "crates/kufeditor-patches",
    "crates/kufeditor-workspace",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
encoding_rs = "0.8.35"
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
kufeditor-formats = { version = "0.1.0", path = "crates/kufeditor-formats" }
kufeditor-game = { version = "0.1.0", path = "crates/kufeditor-game" }
kufeditor-mods = { version = "0.1.0", path = "crates/kufeditor-mods" }
kufeditor-patches = { version = "0.1.0", path = "crates/kufeditor-patches" }
kufeditor-workspace = { version = "0.1.0", path = "crates/kufeditor-workspace" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.20"
time = { version = "0.3.55", default-features = false, features = ["std", "formatting", "parsing"] }
unicode-segmentation = "1.13.3"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

unwrap_used = "warn"
expect_used = "warn"
indexing_slicing = "warn"
undocumented_unsafe_blocks = "warn"
allow_attributes_without_reason = "warn"
clone_on_ref_ptr = "warn"
rc_mutex = "warn"
dbg_macro = "warn"

module_name_repetitions = "allow"
upper_case_acronyms = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
