[graph]
all-features = true

[advisories]
ignore = [
    { id = "RUSTSEC-2024-0384", reason = "GPUI 0.2.2 transitively uses instant; no safe upgrade is available" },
    { id = "RUSTSEC-2024-0436", reason = "GPUI 0.2.2 transitively uses paste; no safe upgrade is available" },
    { id = "RUSTSEC-2025-0052", reason = "GPUI 0.2.2 transitively uses async-std; no safe upgrade is available" },
    { id = "RUSTSEC-2025-0134", reason = "GPUI 0.2.2 transitively uses rustls-pemfile; no safe upgrade is available" },
    { id = "RUSTSEC-2026-0173", reason = "GPUI 0.2.2 transitively uses proc-macro-error2; no safe upgrade is available" },
    { id = "RUSTSEC-2026-0192", reason = "GPUI 0.2.2 transitively uses ttf-parser; no safe upgrade is available" },
    { id = "RUSTSEC-2026-0206", reason = "GPUI 0.2.2 transitively uses rustybuzz; no safe upgrade is available" },
]

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "NCSA",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "simplest-path"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
