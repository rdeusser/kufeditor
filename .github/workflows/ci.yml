name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, name: linux-x64, binary: target/release/kufeditor }
          - { os: ubuntu-24.04-arm, name: linux-arm64, binary: target/release/kufeditor }
          - { os: windows-2022, name: windows-x64, binary: target/release/kufeditor.exe }
          - { os: macos-15-intel, name: macos-x64, binary: target/release/kufeditor }
          - { os: macos-15, name: macos-arm64, binary: target/release/kufeditor }
          - { os: macos-26, name: macos-26-arm64, binary: target/release/kufeditor }

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install GPUI dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libxext-dev \
            libwayland-dev \
            libwayland-bin \
            wayland-protocols \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libasound2-dev \
            libfontconfig1-dev \
            libvulkan-dev \
            pkg-config

      - name: Check project acronym spelling
        if: matrix.name == 'linux-x64'
        run: ./scripts/check-rust-acronyms.sh

      - name: Check Rust formatting
        if: matrix.name == 'linux-x64'
        run: cargo fmt --all -- --check

      - name: Lint Rust workspace
        if: matrix.name == 'linux-x64'
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test Rust workspace
        run: cargo test --workspace --all-targets --all-features --locked

      - name: Build Rust application
        run: cargo build --release --locked -p kufeditor

      - name: Install cargo-deny
        if: matrix.name == 'linux-x64'
        run: cargo install cargo-deny --locked --version 0.20.2

      - name: Audit Rust dependencies
        if: matrix.name == 'linux-x64'
        run: cargo deny check

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: kufeditor-${{ matrix.name }}
          path: ${{ matrix.binary }}
          if-no-files-found: error

  generated:
    name: Check generated parsers
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'
          cache: false

      - name: Setup Rust formatting
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install pinned Cleave
        env:
          GOBIN: ${{ github.workspace }}/.bin
        run: go install github.com/rdeusser/cleave/cmd/cleave@2d455c33ffa070f368551539009b3a16a5cfbdfe

      - name: Check generated parsers
        env:
          CLEAVE: ${{ github.workspace }}/.bin/cleave
        run: ./scripts/check-generated.sh
