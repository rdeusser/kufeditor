name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, name: linux-x64 }
          - { os: ubuntu-24.04-arm, name: linux-arm64 }
          - { os: windows-2022, name: windows-x64, vcpkg_triplet: x64-windows-static }
          - { os: macos-15-intel, name: macos-x64 }
          - { os: macos-15, name: macos-arm64 }
          - { os: macos-26, name: macos-26-arm64 }

    runs-on: ${{ matrix.os }}

    env:
      SCCACHE_GHA_ENABLED: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            libconfig++-dev \
            libgl1-mesa-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libxext-dev \
            libwayland-dev \
            libwayland-bin \
            wayland-protocols \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libasound2-dev \
            libfontconfig1-dev \
            libvulkan-dev \
            pkg-config

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja libconfig pkg-config

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup vcpkg (Windows)
        if: runner.os == 'Windows'
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: '66c0373dc7fca549e5803087b9487edfe3aca0a1'

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: vcpkg install libconfig:${{ matrix.vcpkg_triplet }} libiconv:${{ matrix.vcpkg_triplet }}

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test Rust workspace
        run: cargo test --workspace --all-features

      - name: Build Rust application
        run: cargo build --release -p kufeditor

      - name: Install cargo-deny
        if: matrix.name == 'linux-x64'
        run: cargo install cargo-deny --locked --version 0.20.2

      - name: Audit Rust dependencies
        if: matrix.name == 'linux-x64'
        run: cargo deny check

      - name: Configure (Unix)
        if: runner.os != 'Windows'
        run: >
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER_LAUNCHER=sccache `
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache `
            -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded `
            -DCMAKE_TOOLCHAIN_FILE="${env:VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=${{ matrix.vcpkg_triplet }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kufeditor-${{ matrix.name }}
          path: |
            build/kufeditor
            build/kufeditor.exe
            build/Release/kufeditor.exe

  generated:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
          cache: false

      - name: Install pinned Cleave
        env:
          GOBIN: ${{ github.workspace }}/.bin
        run: go install github.com/rdeusser/cleave/cmd/cleave@cc43fcc4adcc7220d0dfe069fc056711be423b0f

      - name: Check generated parsers
        env:
          CLEAVE: ${{ github.workspace }}/.bin/cleave
        run: ./scripts/check-generated.sh
