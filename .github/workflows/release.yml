name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Package (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, name: linux-x64, asset: kufeditor-linux-x64.tar.gz }
          - { os: ubuntu-24.04-arm, name: linux-arm64, asset: kufeditor-linux-arm64.tar.gz }
          - { os: windows-2022, name: windows-x64, asset: kufeditor-windows-x64.zip }
          - { os: macos-15-intel, name: macos-x64, asset: kufeditor-macos-x64.zip }
          - { os: macos-15, name: macos-arm64, asset: kufeditor-macos-arm64.zip }
          - { os: macos-26, name: macos-26-arm64, asset: kufeditor-macos-26-arm64.zip }

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install GPUI dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libxext-dev \
            libwayland-dev \
            libwayland-bin \
            wayland-protocols \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libasound2-dev \
            libfontconfig1-dev \
            libvulkan-dev \
            pkg-config

      - name: Test Rust workspace
        run: cargo test --workspace --all-targets --all-features --locked

      - name: Build Rust application
        run: cargo build --release --locked -p kufeditor

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp target/release/kufeditor dist/
          tar -czvf ${{ matrix.asset }} -C dist kufeditor

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          cp target/release/kufeditor dist/
          cd dist && zip -r ../${{ matrix.asset }} kufeditor

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target/release/kufeditor.exe dist/
          Compress-Archive -Path dist/kufeditor.exe -DestinationPath ${{ matrix.asset }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: kufeditor-${{ matrix.name }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: kufeditor-*
          path: release
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: release/*
          fail_on_unmatched_files: true
          generate_release_notes: true
